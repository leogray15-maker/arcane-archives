<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reset Password | The Arcane Archives</title>
    <link rel="icon" href="ArcaneA.png">
    <link rel="apple-touch-icon" href="ArcaneA.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-elevated: #121212;
            --bg-card: #1a1a1a;
            --purple: #9333ea;
            --purple-dark: #7e22ce;
            --purple-light: #a78bfa;
            --gold: #fbbf24;
            --text: #f5f5f5;
            --text-dim: #a1a1a1;
            --border: rgba(148, 163, 184, 0.2);
            --red: #ef4444;
            --green: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .back-link {
            position: fixed;
            top: calc(2rem + env(safe-area-inset-top, 0px));
            left: 2rem;
            z-index: 100;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--purple-light);
            border-color: var(--purple);
            transform: translateX(-4px);
        }

        .reset-container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.05), var(--bg-card));
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .reset-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .reset-content { position: relative; z-index: 1; }

        .logo-section { text-align: center; margin-bottom: 2.5rem; }

        .logo-section img {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            border-radius: 16px;
        }

        .logo-section h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, white, var(--purple-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo-section p { color: var(--text-dim); font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15);
        }

        .form-group input::placeholder { color: #6b7280; }

        .reset-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .reset-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.4);
        }

        .reset-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-message {
            display: none;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .status-message.show { display: block; }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .login-prompt {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .login-prompt a {
            color: var(--purple-light);
            text-decoration: none;
            font-weight: 600;
        }

        .login-prompt a:hover { text-decoration: underline; }

        @media (max-width: 540px) {
            .reset-container { padding: 2rem 1.5rem; }
            .back-link { top: 1rem; left: 1rem; }
        }
    </style>
</head>
<body>
    <a href="login.html" class="back-link">← Back to Login</a>

    <div class="reset-container">
        <div class="reset-content">
            <div class="logo-section">
                <img src="ArcaneA.png" alt="Arcane Archives Logo">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="status-message" id="statusMessage"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="reset-btn" id="resetBtn">
                    Send Reset Link
                </button>
            </form>

            <div class="login-prompt">
                <p>Remembered your password? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK9MheMvSeOpscic4lXUsIwa0J5ubVf6w",
            authDomain: "arcane-archives-3b0f5.firebaseapp.com",
            projectId: "arcane-archives-3b0f5",
            storageBucket: "arcane-archives-3b0f5.firebasestorage.app",
            messagingSenderId: "264237235055",
            appId: "1:264237235055:web:4a2e5605b0ffb5307f069a",
            measurementId: "G-YGPLQHDXMM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('resetForm');
        const btn = document.getElementById('resetBtn');
        const status = document.getElementById('statusMessage');

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status-message show ${type}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.textContent = 'Sending…';
            status.className = 'status-message';

            try {
                await sendPasswordResetEmail(auth, email);
                showStatus(
                    'If an account exists for ' + email + ', a password reset link is on its way. Check your inbox (and spam folder).',
                    'success'
                );
                form.reset();
            } catch (error) {
                console.error('Password reset error:', error);
                let message = 'Could not send the reset email. Please try again.';
                if (error.code === 'auth/invalid-email') {
                    message = 'That email address looks invalid.';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Too many attempts. Please wait a few minutes and try again.';
                } else if (error.code === 'auth/user-not-found') {
                    // Don't reveal whether an account exists
                    showStatus(
                        'If an account exists for ' + email + ', a password reset link is on its way. Check your inbox (and spam folder).',
                        'success'
                    );
                    form.reset();
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                    return;
                }
                showStatus(message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        });
    </script>
</body>
</html>
