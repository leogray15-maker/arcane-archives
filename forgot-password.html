<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reset Password | The Arcane Archives</title>
    <link rel="icon" href="ArcaneA.png">
    <link rel="apple-touch-icon" href="ArcaneA.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-elevated: #121212;
            --bg-card: #1a1a1a;
            --purple: #9333ea;
            --purple-dark: #7e22ce;
            --purple-light: #a78bfa;
            --gold: #fbbf24;
            --text: #f5f5f5;
            --text-dim: #a1a1a1;
            --border: rgba(148, 163, 184, 0.2);
            --red: #ef4444;
            --green: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .back-link {
            position: fixed;
            top: calc(2rem + env(safe-area-inset-top, 0px));
            left: 2rem;
            z-index: 100;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--purple-light);
            border-color: var(--purple);
            transform: translateX(-4px);
        }

        .login-container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.05), var(--bg-card));
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-content {
            position: relative;
            z-index: 1;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-section img {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            border-radius: 16px;
        }

        .logo-section h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, white, var(--purple-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .logo-section p {
            color: var(--text-dim);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.625rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(147, 51, 234, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signup-prompt {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .signup-prompt p {
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .signup-prompt a {
            color: var(--purple-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .signup-prompt a:hover {
            color: var(--purple);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            color: var(--red);
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--green);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            color: var(--green);
            font-size: 0.875rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            .back-link {
                top: calc(1rem + env(safe-area-inset-top, 0px));
                left: 1rem;
            }
            .login-container { padding: 2rem 1.5rem; }
            .logo-section h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <a href="login.html" class="back-link">← Back to Login</a>

    <div class="login-container">
        <div class="login-content">
            <div class="logo-section">
                <img src="ArcaneA.png" alt="Arcane Archives Logo">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="login-btn" id="resetBtn">
                    Send Reset Link
                </button>
            </form>

            <div class="signup-prompt">
                <p>Remembered it? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK9MheMvSeOpscic4lXUsIwa0J5ubVf6w",
            authDomain: "arcane-archives-3b0f5.firebaseapp.com",
            projectId: "arcane-archives-3b0f5",
            storageBucket: "arcane-archives-3b0f5.firebasestorage.app",
            messagingSenderId: "264237235055",
            appId: "1:264237235055:web:4a2e5605b0ffb5307f069a",
            measurementId: "G-YGPLQHDXMM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            try {
                await sendPasswordResetEmail(auth, email);
                // Generic success message (don't reveal whether an account exists)
                successMessage.textContent =
                    'If an account exists for that email, a password reset link is on its way. Check your inbox and spam folder.';
                successMessage.classList.add('show');
                resetForm.reset();
                resetBtn.textContent = 'Send Reset Link';
                resetBtn.disabled = false;
            } catch (error) {
                console.error('Password reset error:', error);
                // auth/user-not-found is intentionally treated as success above via the
                // generic message; only surface genuinely actionable errors here.
                let message = 'Something went wrong. Please try again.';
                if (error.code === 'auth/invalid-email') {
                    message = 'That doesn’t look like a valid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Too many attempts. Please wait a few minutes and try again.';
                } else if (error.code === 'auth/user-not-found') {
                    // Don't disclose account existence — show the generic success message.
                    successMessage.textContent =
                        'If an account exists for that email, a password reset link is on its way. Check your inbox and spam folder.';
                    successMessage.classList.add('show');
                    resetForm.reset();
                    resetBtn.textContent = 'Send Reset Link';
                    resetBtn.disabled = false;
                    return;
                }
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                resetBtn.textContent = 'Send Reset Link';
                resetBtn.disabled = false;
            }
        });

        // If already logged in, no reason to be here
        auth.onAuthStateChanged((user) => {
            if (user) window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
