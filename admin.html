<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Admin | The Arcane Archives</title>
  <link rel="icon" href="ArcaneA.png">
  <link rel="apple-touch-icon" href="ArcaneA.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030303">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal-shell.css">

  <style>
    /* ═══════════════════════════════════════════════════════════
       THE ARCANE ARCHIVES — UNIFIED ADMIN CONSOLE
       Every admin feature on one page. Each tool runs in its own
       isolated iframe panel, switched via the tab rail.
       ═══════════════════════════════════════════════════════════ */
    :root {
      --bg-primary:   #030303;
      --bg-secondary: #0a0a0a;
      --bg-card:      #0f0f0f;
      --bg-elevated:  #161616;
      --bg-hover:     #1a1a1a;

      --purple:       #8b5cf6;
      --purple-light: #a78bfa;
      --purple-dark:  #7c3aed;

      --gold:         #fbbf24;
      --gold-light:   #fcd34d;

      --green:        #22c55e;
      --red:          #ef4444;

      --text:         #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted:   #71717a;

      --border:       rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);

      --nav-h: 64px;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; color: inherit; }
    svg { display: block; }

    /* ════════ CONSOLE LAYOUT ════════ */
    .admin-console {
      position: relative;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--nav-h) - env(safe-area-inset-top, 0px));
    }

    /* ── Header strip ── */
    .console-head {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.4rem 0.7rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .console-title { font-size: 0.98rem; font-weight: 800; letter-spacing: -0.01em; }
    .console-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.22rem 0.6rem; border-radius: 999px;
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
      color: var(--gold); font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .console-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .console-open {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.45rem 0.85rem; border-radius: 9px;
      border: 1px solid var(--border-hover); background: var(--bg-card);
      color: var(--text-secondary); font-size: 0.78rem; font-weight: 600;
      transition: all 0.2s;
    }
    .console-open:hover { color: #fff; border-color: var(--purple); background: var(--bg-elevated); }

    /* ── Tab rail ── */
    .console-tabs {
      flex-shrink: 0;
      display: flex; gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      overflow-x: auto; overflow-y: hidden;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.6);
      scrollbar-width: thin;
    }
    .console-tabs::-webkit-scrollbar { height: 6px; }
    .console-tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }
    .tab {
      display: inline-flex; align-items: center; gap: 0.5rem;
      flex-shrink: 0;
      padding: 0.55rem 0.95rem; border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.83rem; font-weight: 600; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab .tab-ico { font-size: 1rem; line-height: 1; }
    .tab:hover { color: #fff; border-color: var(--border-hover); background: var(--bg-elevated); }
    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(139,92,246,0.06));
      border-color: rgba(139,92,246,0.4);
      box-shadow: 0 0 0 1px rgba(139,92,246,0.12);
    }

    /* ── Frame area ── */
    .console-stage { position: relative; flex: 1; min-height: 0; background: var(--bg-primary); }
    .console-frame { width: 100%; height: 100%; border: 0; display: block; background: var(--bg-primary); }
    .console-loading {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
      background: var(--bg-primary);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .console-loading.show { opacity: 1; pointer-events: all; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(139,92,246,0.2); border-top-color: var(--purple);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .console-loading-text { color: var(--text-muted); font-size: 0.82rem; letter-spacing: 0.04em; }

    /* ── Access gate ── */
    .admin-gate {
      position: fixed; inset: 0; z-index: 5000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      background: var(--bg-primary);
    }
    .admin-gate.hidden { display: none; }
    .admin-gate-text { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 0.04em; }

    @media (max-width: 640px) {
      .console-head { padding: 0.7rem 1rem 0.6rem; }
      .console-tabs { padding: 0.55rem 1rem; }
      .console-open .open-label { display: none; }
    }
  </style>
</head>
<body data-page="admin">

  <!-- ════════ ACCESS GATE ════════ -->
  <div class="admin-gate" id="admin-gate">
    <div class="spinner"></div>
    <div class="admin-gate-text">Verifying admin access…</div>
  </div>

  <main class="admin-console" id="admin-console" style="display:none">
    <div class="console-head">
      <span class="console-title">Admin Control Center</span>
      <span class="console-badge"><span class="console-badge-dot"></span>Admin Only</span>
      <a class="console-open" id="open-standalone" href="#" target="_blank" rel="noopener" title="Open current tool in a full tab">
        <span class="open-label">Open in tab</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>

    <nav class="console-tabs" id="console-tabs" role="tablist"></nav>

    <div class="console-stage">
      <iframe class="console-frame" id="console-frame" title="Admin tool" allow="clipboard-read; clipboard-write"></iframe>
      <div class="console-loading show" id="console-loading">
        <div class="spinner"></div>
        <div class="console-loading-text">Loading…</div>
      </div>
    </div>
  </main>

  <!-- ════════ SCRIPTS ════════ -->
  <script type="module">
    import { auth, ADMIN_UIDS } from './auth-guard.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

    // Every admin tool, grouped logically. id is used in the URL hash.
    const TOOLS = [
      { id: 'trades',     label: 'Trades & Alerts', icon: '🛡️', src: 'admin-panel.html' },
      { id: 'stocks',     label: 'Stock Picks',     icon: '📊', src: 'stock-picks-admin.html' },
      { id: 'insights',   label: 'Arcane Insights', icon: '🧠', src: 'arcane-insight-admin.html' },
      { id: 'members',    label: 'Member CRM',      icon: '👥', src: 'arcane-crm.html' },
      { id: 'consulting', label: 'Consulting CRM',  icon: '💼', src: 'arcane-consulting-crm.html' },
      { id: 'affiliates', label: 'Affiliates',      icon: '🔗', src: 'affiliate-admin.html' },
      { id: 'store',      label: 'Store Admin',     icon: '🏪', src: 'store-admin.html' },
      { id: 'bullion',    label: 'Bullion Admin',   icon: '🥇', src: 'bullion-admin.html' },
    ];

    const tabsEl    = document.getElementById('console-tabs');
    const frameEl   = document.getElementById('console-frame');
    const loadingEl = document.getElementById('console-loading');
    const openEl    = document.getElementById('open-standalone');
    let activeId    = null;

    // Build tabs
    TOOLS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.id = t.id;
      b.setAttribute('role', 'tab');
      b.innerHTML = `<span class="tab-ico">${t.icon}</span><span>${t.label}</span>`;
      b.addEventListener('click', () => selectTool(t.id, true));
      tabsEl.appendChild(b);
    });

    function selectTool(id, updateHash) {
      const tool = TOOLS.find(t => t.id === id) || TOOLS[0];
      if (tool.id === activeId) return;
      activeId = tool.id;

      tabsEl.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === tool.id));
      openEl.href = tool.src;
      loadingEl.classList.add('show');
      frameEl.src = tool.src;

      if (updateHash) {
        const newHash = '#' + tool.id;
        if (location.hash !== newHash) history.replaceState(null, '', newHash);
      }
      document.title = `${tool.label} · Admin | The Arcane Archives`;
    }

    frameEl.addEventListener('load', () => loadingEl.classList.remove('show'));

    // Respond to hash changes (deep links / back-forward)
    window.addEventListener('hashchange', () => {
      const id = location.hash.replace('#', '');
      if (TOOLS.some(t => t.id === id)) selectTool(id, false);
    });

    // ── Auth gate ──
    onAuthStateChanged(auth, user => {
      if (!user) { location.href = 'login.html'; return; }
      if (!ADMIN_UIDS.includes(user.uid)) { location.href = 'dashboard.html'; return; }
      document.getElementById('admin-gate').classList.add('hidden');
      document.getElementById('admin-console').style.display = '';
      const initial = location.hash.replace('#', '');
      selectTool(TOOLS.some(t => t.id === initial) ? initial : TOOLS[0].id, true);
    });
  </script>
  <script type="module" src="portal-shell.js"></script>
</body>
</html>
