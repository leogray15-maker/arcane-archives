<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reader | The Arcane Archives</title>
  <link rel="icon" href="ArcaneA.png">
  <link rel="apple-touch-icon" href="ArcaneA.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030303">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="arcane-portal.css">
  <style>
    .reader-wrap { display: grid; grid-template-columns: 288px 1fr; gap: 1.6rem; align-items: start; }

    /* Lesson list (course contents) */
    .lessons-panel {
      position: sticky; top: calc(var(--nav-h) + 1.5rem);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
      max-height: calc(100vh - var(--nav-h) - 3rem); overflow: hidden; display: flex; flex-direction: column;
    }
    .lessons-head { padding: 1.1rem 1.2rem; border-bottom: 1px solid var(--border); }
    .lessons-head .eyebrow { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--purple-light); margin-bottom: 0.35rem; }
    .lessons-head .ctitle { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
    .lessons-head .cmeta { font-family: var(--mono); font-size: 0.66rem; color: var(--text-muted); margin-top: 0.4rem; }
    .lessons-list { overflow-y: auto; padding: 0.5rem; }
    .lesson-link {
      display: flex; gap: 0.6rem; align-items: baseline; padding: 0.55rem 0.7rem; border-radius: 9px;
      color: var(--text-secondary); font-size: 0.84rem; font-weight: 500; line-height: 1.4; transition: all 0.16s; cursor: pointer;
    }
    .lesson-link .num { font-family: var(--mono); font-size: 0.66rem; color: var(--text-muted); flex-shrink: 0; min-width: 1.4em; }
    .lesson-link:hover { background: var(--bg-elevated); color: var(--text); }
    .lesson-link.active { background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(139,92,246,0.05)); border: 1px solid rgba(139,92,246,0.28); color: var(--text); }
    .lesson-link.active .num { color: var(--purple-light); }
    .lesson-link .ltitle { flex: 1; min-width: 0; }
    .lesson-link .ldone { color: var(--green); font-weight: 700; flex-shrink: 0; }
    .lesson-link.done .num { color: var(--green); }
    .lesson-link.done .ltitle { color: var(--text-muted); }

    /* Course progress */
    .cprogress { margin-top: 0.85rem; }
    .cprogress-bar { height: 6px; border-radius: 6px; background: var(--bg-elevated); overflow: hidden; }
    .cprogress-fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--purple), var(--gold)); transition: width 0.45s cubic-bezier(0.4,0,0.2,1); }
    .cprogress-count { font-family: var(--mono); font-size: 0.62rem; color: var(--text-muted); margin-top: 0.45rem; letter-spacing: 0.04em; }

    /* Reading view */
    .reader-main { min-width: 0; }
    .reader-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.5rem 2.75rem; overflow: hidden;
    }
    .reader-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, var(--purple), var(--gold)); opacity:0.7; }
    .reader-crumb { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1rem; }
    .reader-crumb a { color: var(--purple-light); cursor: pointer; }
    .reader-crumb a:hover { text-decoration: underline; }
    .reader-crumb .crumb-sep { color: var(--text-muted); }

    /* Module index (folder contents shown in the reading pane) */
    .mod-index { display: grid; gap: 0.6rem; margin-top: 1.25rem; }
    .mod-card { display: flex; align-items: center; gap: 0.9rem; padding: 0.9rem 1.1rem; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .mod-card:hover { border-color: var(--border-hover); transform: translateX(3px); }
    .mod-card.done { border-color: rgba(34,197,94,0.3); }
    .mod-num { font-family: var(--mono); font-size: 0.7rem; color: var(--text-muted); min-width: 1.6em; }
    .mod-name { flex: 1; font-weight: 600; color: var(--text); }
    .mod-arrow { color: var(--purple-light); font-weight: 700; flex-shrink: 0; }
    .mod-card.done .mod-arrow { color: var(--green); }
    .reader-title { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 1.5rem; }

    /* Prose */
    .prose { color: var(--text-secondary); font-size: 1.02rem; line-height: 1.8; }
    .prose > *:first-child { margin-top: 0; }
    .prose h1, .prose h2, .prose h3 { color: var(--text); font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 2rem 0 0.85rem; }
    .prose h1 { font-size: 1.55rem; }
    .prose h2 { font-size: 1.3rem; }
    .prose h3 { font-size: 1.1rem; }
    .prose p { margin: 0 0 1rem; }
    .prose strong { color: var(--text); font-weight: 700; }
    .prose em { color: var(--purple-light); font-style: italic; }
    .prose a { color: var(--purple-light); text-decoration: underline; text-underline-offset: 2px; }
    .prose ul, .prose ol { margin: 0 0 1.1rem 1.4rem; }
    .prose li { margin: 0.35rem 0; }
    .prose li.todo { list-style: none; }
    .prose li.todo::before { content: "☐ "; color: var(--text-muted); }
    .prose li.todo.done::before { content: "☑ "; color: var(--green); }
    .prose blockquote { border-left: 3px solid var(--purple); background: rgba(139,92,246,0.05); padding: 0.85rem 1.2rem; border-radius: 0 10px 10px 0; margin: 0 0 1.1rem; color: var(--text-secondary); font-style: italic; }
    .prose .callout { display: flex; gap: 0.6rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin: 0 0 1.1rem; }
    .prose pre { background: #0c0c12; border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.3rem; overflow-x: auto; margin: 0 0 1.1rem; }
    .prose code { font-family: var(--mono); font-size: 0.88em; background: var(--bg-elevated); padding: 0.1em 0.4em; border-radius: 5px; }
    .prose pre code { background: none; padding: 0; }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0; }
    .prose figure { margin: 0 0 1.2rem; }
    .prose img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); }

    /* Lesson pager */
    .lesson-pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .pager-btn { flex: 1; max-width: 48%; }
    .pager-btn.next { margin-left: auto; text-align: right; }

    /* States */
    .reader-state { text-align: center; padding: 4rem 1.5rem; color: var(--text-muted); }
    .reader-state .spin { width: 38px; height: 38px; margin: 0 auto 1.25rem; border: 3px solid rgba(139,92,246,0.2); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .reader-state h3 { color: var(--text-secondary); font-weight: 700; margin-bottom: 0.5rem; }
    .reader-state a.btn-primary { margin-top: 1rem; }

    /* Mobile lessons toggle */
    .lessons-toggle { display: none; }
    @media (max-width: 900px) {
      .reader-wrap { grid-template-columns: 1fr; }
      .lessons-panel { position: static; max-height: none; }
      .lessons-list { max-height: 320px; }
      .reader-card { padding: 1.75rem 1.4rem; }
    }
  </style>
</head>
<body data-page="courses">
  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>

  <main class="portal-page" style="max-width:1240px">
    <div class="reader-wrap">
      <!-- Lessons -->
      <aside class="lessons-panel">
        <div class="lessons-head">
          <div class="eyebrow">Course</div>
          <div class="ctitle" id="course-title">Loading…</div>
          <div class="cmeta" id="course-meta"></div>
          <div class="cprogress" id="course-progress" style="display:none">
            <div class="cprogress-bar"><div class="cprogress-fill" id="progress-fill"></div></div>
            <div class="cprogress-count" id="progress-count">0 / 0 complete</div>
          </div>
        </div>
        <div class="lessons-list" id="lessons-list"></div>
      </aside>

      <!-- Reading view -->
      <div class="reader-main">
        <div class="reader-card">
          <div class="reader-crumb">
            <a href="courses.html">← All Courses</a>
          </div>
          <h1 class="reader-title" id="reader-title">&nbsp;</h1>
          <div class="prose" id="reader-content">
            <div class="reader-state"><div class="spin"></div><div>Loading content…</div></div>
          </div>
          <div class="lesson-pager" id="lesson-pager" style="display:none">
            <a class="btn-ghost pager-btn prev" id="pager-prev" style="visibility:hidden">← Previous</a>
            <button class="btn-primary pager-btn next" id="pager-next" style="visibility:hidden">Complete &amp; Continue →</button>
          </div>
        </div>

        <div class="dash-footer">
          <span class="version-tag">The Arcane Archives · v3.0</span>
          <a class="btn-ghost" href="courses.html">← Courses</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="portal-shell.js"></script>

  <script type="module">
    import { protectPage, db } from './auth-guard.js';
    import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const courseId = (params.get('course') || '').replace(/-/g, '');
    let lessonId = (params.get('lesson') || '').replace(/-/g, '');

    const $ = id => document.getElementById(id);
    let crumbs = [];           // folder path from course root → current folder
    let LEVEL = [];            // current folder's child modules (sidebar list)
    let ROOT_LESSONS = [];     // course root's direct children (for completion)
    let activeLeaf = null;     // currently-open leaf module id
    let UID = null;
    let COMPLETED = new Set();  // completed module IDs for this course

    const cur = () => crumbs[crumbs.length - 1] || { id: courseId, title: 'Course' };
    const escAttr = s => String(s || '').replace(/"/g, '&quot;');

    function loading() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('reader-content').innerHTML = '<div class="reader-state"><div class="spin"></div><div>Loading content…</div></div>';
    }

    // Try the live Notion API (with a timeout), then fall back to a committed snapshot.
    async function fetchPage(id) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 12000);
        const r = await fetch(`/api/notion?id=${id}`, { signal: ctrl.signal });
        clearTimeout(t);
        if (r.ok) {
          const j = await r.json();
          if (!j.error) return j;
        }
      } catch (_) {}
      try {
        const r = await fetch(`content/${id}.json`);
        if (r.ok) return await r.json();
      } catch (_) {}
      return null;
    }

    function showError(id, title, retryFn) {
      $('reader-title').textContent = title || 'Module';
      $('reader-content').innerHTML = `
        <div class="reader-state">
          <h3>Couldn't load this content</h3>
          <p>The connection may be slow or interrupted. Try again, or open it directly in Notion.</p>
          <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
            <button class="btn-primary" id="retry-btn">↻ Retry</button>
            <a class="btn-ghost" href="https://www.notion.so/${id}" target="_blank" rel="noopener">Open in Notion ↗</a>
          </div>
        </div>`;
      $('lesson-pager').style.display = 'none';
      const rb = $('retry-btn'); if (rb && retryFn) rb.addEventListener('click', retryFn);
    }

    function renderProgress() {
      const total = LEVEL.length;
      const done = LEVEL.filter(l => COMPLETED.has(l.id)).length;
      const wrap = $('course-progress');
      if (!total) { wrap.style.display = 'none'; return; }
      wrap.style.display = '';
      $('progress-fill').style.width = Math.round(done / total * 100) + '%';
      $('progress-count').textContent = `${done} / ${total} complete`;
    }

    function renderBreadcrumb() {
      const parts = ['<a href="courses.html">All Courses</a>'];
      crumbs.forEach((c, i) => {
        const isLast = i === crumbs.length - 1 && !activeLeaf;
        parts.push(isLast ? `<span>${c.title}</span>` : `<a data-crumb="${i}">${c.title}</a>`);
      });
      if (activeLeaf) {
        const lt = (LEVEL.find(l => l.id === activeLeaf) || {}).title || '';
        parts.push(`<span>${lt}</span>`);
      }
      const el = $('reader-crumb');
      el.innerHTML = parts.join(' <span class="crumb-sep">›</span> ');
      el.querySelectorAll('[data-crumb]').forEach(a => a.addEventListener('click', () => goToCrumb(+a.dataset.crumb)));
    }

    function renderLessons() {
      const list = $('lessons-list');
      if (!LEVEL.length) { list.innerHTML = '<div style="padding:1rem;color:var(--text-muted);font-size:0.82rem">No sub-modules.</div>'; return; }
      list.innerHTML = LEVEL.map((l, i) => {
        const done = COMPLETED.has(l.id);
        return `
        <a class="lesson-link${l.id === activeLeaf ? ' active' : ''}${done ? ' done' : ''}" data-id="${l.id}" data-title="${escAttr(l.title)}">
          <span class="num">${String(i + 1).padStart(2, '0')}</span>
          <span class="ltitle">${l.title}</span>
          ${done ? '<span class="ldone">✓</span>' : ''}
        </a>`;
      }).join('');
      list.querySelectorAll('.lesson-link').forEach(el => el.addEventListener('click', () => openItem(el.dataset.id, el.dataset.title)));
    }

    function childIndexHtml(items) {
      return '<div class="mod-index">' + items.map((l, i) => {
        const done = COMPLETED.has(l.id);
        return `<a class="mod-card${done ? ' done' : ''}" data-id="${l.id}" data-title="${escAttr(l.title)}">
          <span class="mod-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="mod-name">${l.title}</span>
          <span class="mod-arrow">${done ? '✓' : '→'}</span>
        </a>`;
      }).join('') + '</div>';
    }

    function renderHeader() {
      $('course-title').textContent = (crumbs[0] && crumbs[0].title) || 'Course';
      $('course-meta').textContent = LEVEL.length ? `${LEVEL.length} ${LEVEL.length === 1 ? 'module' : 'modules'}` : '';
      renderBreadcrumb();
    }

    function renderPager(id, isFolder) {
      const pager = $('lesson-pager'), prev = $('pager-prev'), next = $('pager-next');
      pager.style.display = 'flex';
      if (isFolder) {
        prev.style.visibility = 'hidden';
        next.style.visibility = 'visible';
        next.textContent = COMPLETED.has(id) ? '✓ Section Completed' : '✓ Mark Section Complete';
        next.onclick = async () => { await markComplete(id); next.textContent = '✓ Section Completed'; };
        return;
      }
      const idx = LEVEL.findIndex(l => l.id === id);
      if (idx === -1) { pager.style.display = 'none'; return; }
      if (idx > 0) { prev.style.visibility = 'visible'; prev.textContent = '← ' + LEVEL[idx-1].title; prev.onclick = () => openItem(LEVEL[idx-1].id, LEVEL[idx-1].title); }
      else prev.style.visibility = 'hidden';
      next.style.visibility = 'visible';
      if (idx < LEVEL.length - 1) {
        next.textContent = 'Complete & Continue →';
        next.onclick = async () => { await markComplete(id); openItem(LEVEL[idx+1].id, LEVEL[idx+1].title); };
      } else {
        next.textContent = COMPLETED.has(id) ? '✓ Completed' : '✓ Mark Complete';
        next.onclick = async () => { await markComplete(id); next.textContent = '✓ Completed'; };
      }
    }

    function enterFolder(data) {
      activeLeaf = null;
      LEVEL = data.lessons || [];
      renderHeader();
      renderLessons();
      renderProgress();
      let html = (data.html && data.html.trim()) ? data.html : '';
      if (LEVEL.length) html += childIndexHtml(LEVEL);
      $('reader-title').textContent = cur().title;
      $('reader-content').innerHTML = html || '<div class="reader-state"><h3>Select a module to begin →</h3></div>';
      $('reader-content').querySelectorAll('.mod-card').forEach(el => el.addEventListener('click', () => openItem(el.dataset.id, el.dataset.title)));
      renderPager(cur().id, true);
    }

    function enterLeaf(id, data) {
      activeLeaf = id;
      renderHeader();
      renderLessons();
      renderProgress();
      $('reader-title').textContent = data.title || 'Module';
      $('reader-content').innerHTML = (data.html && data.html.trim())
        ? data.html
        : '<div class="reader-state"><h3>This module has no readable content yet.</h3></div>';
      renderPager(id, false);
    }

    async function openItem(id, title) {
      id = (id || '').replace(/-/g, '');
      loading();
      const data = await fetchPage(id);
      if (!data) { showError(id, title, () => openItem(id, title)); return; }
      if ((data.lessons || []).length > 0) {
        crumbs.push({ id, title: data.title || title || 'Section' });
        enterFolder(data);
      } else {
        enterLeaf(id, data);
      }
      history.replaceState(null, '', `read.html?course=${courseId}&lesson=${id}`);
    }

    async function goToCrumb(i) {
      crumbs = crumbs.slice(0, i + 1);
      activeLeaf = null;
      loading();
      const c = crumbs[i];
      const data = await fetchPage(c.id);
      if (!data) { showError(c.id, c.title, () => goToCrumb(i)); return; }
      enterFolder(data);
      history.replaceState(null, '', `read.html?course=${courseId}&lesson=${c.id}`);
    }

    async function markComplete(id) {
      if (!id || COMPLETED.has(id)) return;
      COMPLETED.add(id);
      renderLessons();
      renderProgress();
      $('reader-content').querySelectorAll(`.mod-card[data-id="${id}"]`).forEach(el => {
        el.classList.add('done'); const a = el.querySelector('.mod-arrow'); if (a) a.textContent = '✓';
      });
      if (UID) {
        const update = { ['courseProgress.' + courseId + '.' + id]: true };
        if (ROOT_LESSONS.length > 0 && ROOT_LESSONS.every(l => COMPLETED.has(l.id))) {
          update['coursesCompleted.' + courseId] = true;
        }
        try { await updateDoc(doc(db, 'Users', UID), update); }
        catch (e) { console.warn('Progress save failed:', e.message); }
      }
    }

    async function init() {
      if (!courseId) { location.href = 'courses.html'; return; }
      const root = await fetchPage(courseId);
      if (!root) { $('course-title').textContent = 'Course'; showError(courseId, 'Course', init); return; }
      crumbs = [{ id: courseId, title: root.title || 'Course' }];
      ROOT_LESSONS = root.lessons || [];
      enterFolder(root);
      if (lessonId && lessonId !== courseId) openItem(lessonId, '');
    }

    protectPage({
      requirePayment: true,
      allowAdmin: true,
      onSuccess: (user, userData) => {
        UID = user.uid;
        const cp = userData && userData.courseProgress && userData.courseProgress[courseId];
        COMPLETED = new Set(cp ? Object.keys(cp) : []);
        init();
      },
      onFailure: () => { location.href = 'login.html'; }
    });
  </script>
</body>
</html>
